name: CI

env:
  CLOUDFLARE_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  worker:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install modules
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run Tests
        run: bun run test

  opentofu:
    name: OpenTofu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # worker.tofu reads the bundled Worker with file(),
      # so the bundle (worker/dist/index.js) must exist before `tofu validate`.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build Worker bundle
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version_file: .opentofu-version

      - name: Format
        run: tofu fmt -check -recursive

      - name: Init and validate (infra)
        working-directory: infra
        run: |
          tofu init -backend=false
          tofu validate

      - name: Init and validate (infra/bootstrap)
        working-directory: infra/bootstrap
        run: |
          tofu init -backend=false
          tofu validate

  # There is no apply job yet. When it exists, run after `tofu apply` and
  # before the Worker is used:
  #   - name: Apply D1 migrations
  #     run: bunx wrangler d1 migrations apply gqlmd-telemetry --remote --config worker/wrangler.jsonc
  #     env:
  #       CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  #       CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
