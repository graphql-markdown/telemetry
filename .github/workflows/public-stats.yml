name: Public stats

env:
  CLOUDFLARE_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: public-stats
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install modules
        run: bun install --frozen-lockfile

      - name: Export
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir _site && cp -R public/. _site/
          scripts/export-public.sh _site/stats.json
          touch _site/.nojekyll

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish public stats"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push --force "https://github.com/${GITHUB_REPOSITORY}.git" gh-pages
