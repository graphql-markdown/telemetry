<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#485e58">
  <meta name="robots" content="noindex, nofollow, noarchive, noimageindex, noai, noimageai">
  <title>GraphQL-Markdown public usage statistics</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'">
  <link rel="stylesheet" href="public.css">
</head>
<body>
<div class="shell">
  <header>
    <div class="topline">
      <div class="brand">
        <img class="logo" src="logo.svg" alt="" width="44" height="44">
        <div><div class="eyebrow">GraphQL-Markdown</div><h1>Usage statistics</h1></div>
      </div>
      <button class="button" id="themeButton" type="button" aria-label="Toggle theme">◐&nbsp; Theme</button>
    </div>
    <div class="hero">
      <h2>Public usage overview</h2>
      <p>Anonymous and aggregated. Raw events from local runs only (CI and quarantined events excluded). Last 90 days.</p>
    </div>
  </header>
  <main>
    <div class="grid" id="out"></div>
    <aside class="card note">
      <p><small id="updated"></small></p>
      <p><strong>n&lt;5 suppressed:</strong> values with fewer than 5 events in the range are hidden. Opt-out and blocked-network users are undercounted.</p>
    </aside>
  </main>
</div>
<script src="public.js"></script>
</body>
</html>
